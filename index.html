<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>株価下落スコープ・ダッシュボード</title>
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121214;
            color: #e1e1e6;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #ff5252; font-size: 24px; margin-bottom: 5px; }
        .subtitle { color: #a8a8b3; font-size: 13px; margin-bottom: 20px; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; }
        .left-panel { flex: 1; min-width: 650px; background: #202024; border-radius: 8px; padding: 16px; }
        .right-panel { width: 450px; background: #202024; border-radius: 8px; padding: 16px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #2e2e32; }
        th { background-color: #121214; color: #a8a8b3; }
        tr:hover { background-color: #29292e; cursor: pointer; }
        .badge-danger { background-color: #ff5252; color: white; padding: 3px 6px; border-radius: 4px; font-weight: bold; }
        .badge-warning { background-color: #ff9800; color: black; padding: 3px 6px; border-radius: 4px; font-weight: bold; }
        .badge-info { color: #29b6f6; }
        #chart { width: 100%; height: 350px; margin-top: 10px; }
        .loading { color: #e1a100; font-weight: bold; }
        .guide-box { background: #18181b; padding: 10px; border-radius: 6px; margin-top: 10px; font-size: 13px; }
    </style>
</head>
<body>

    <h1>📉 株価下落銘柄ピックアップ・スコープ</h1>
    <div class="subtitle">VWAP割り込み、デッドクロス、RSI反落など下落根拠が重なる銘柄を抽出</div>

    <div class="container">
        <div class="left-panel">
            <h2>下落検出銘柄一覧</h2>
            <p id="status-msg" class="loading">データを取得中...</p>
            <table>
                <thead>
                    <tr>
                        <th>コード/銘柄</th>
                        <th>現在値</th>
                        <th>VWAP</th>
                        <th>下落根拠 / パターン</th>
                        <th>判定</th>
                    </tr>
                </thead>
                <tbody id="signal-list"></tbody>
            </table>
        </div>

        <div class="right-panel">
            <h2 id="chart-title">銘柄を選択してください</h2>
            <div id="trade-guide" class="guide-box" style="display:none;">
                損切り目安: <b id="stop-val" style="color:#ff5252;">-</b> | 
                目標利確: <b id="profit-val" style="color:#00e676;">-</b>
            </div>
            <div id="chart"></div>
        </div>
    </div>

    <script>
        let chart = null, candleSeries = null, vwapSeries = null;

        function initChart() {
            const container = document.getElementById('chart');
            container.innerHTML = '';
            chart = LightweightCharts.createChart(container, {
                layout: { backgroundColor: '#202024', textColor: '#e1e1e6' },
                grid: { vertLines: { color: '#2e2e32' }, horzLines: { color: '#2e2e32' } },
                timeScale: { timeVisible: true }
            });
            candleSeries = chart.addCandlestickSeries({ upColor: '#00e676', downColor: '#ff5252' });
            vwapSeries = chart.addLineSeries({ color: '#ff9800', lineWidth: 2, title: 'VWAP' });
        }

        async function loadChart(item) {
            document.getElementById('chart-title').innerText = `${item.code} ${item.name} (5分足)`;
            document.getElementById('trade-guide').style.display = 'block';
            document.getElementById('stop-val').innerText = `${item.stop_loss}円`;
            document.getElementById('profit-val').innerText = `${item.take_profit}円`;

            if (!chart) initChart();

            try {
                const res = await fetch(`/api/chart/${item.code}`);
                const data = await res.json();
                if (data.candles && data.candles.length > 0) {
                    candleSeries.setData(data.candles);
                    vwapSeries.setData(data.vwap || []);
                    chart.timeScale().fitContent();
                }
            } catch (err) { console.error(err); }
        }

        async function fetchSignals() {
            try {
                const res = await fetch('/api/signals');
                const data = await res.json();
                const tbody = document.getElementById('signal-list');
                tbody.innerHTML = '';

                document.getElementById('status-msg').innerText = `更新完了: ${data.length} 銘柄を検出`;
                document.getElementById('status-msg').className = '';

                data.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.onclick = () => loadChart(item);

                    let badge = 'badge-info';
                    if (item.score >= 4) badge = 'badge-danger';
                    else if (item.score >= 2) badge = 'badge-warning';

                    tr.innerHTML = `
                        <td><strong>${item.code}</strong><br><small>${item.name}</small></td>
                        <td>${item.price.toLocaleString()}円</td>
                        <td>${item.vwap.toLocaleString()}円</td>
                        <td><small>${item.reasons}</small></td>
                        <td><span class="${badge}">${item.judgment}</span></td>
                    `;
                    tbody.appendChild(tr);
                });

                if (data.length > 0) loadChart(data[0]);
            } catch (err) {
                document.getElementById('status-msg').innerText = 'データ取得エラー';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchSignals();
            setInterval(fetchSignals, 60000);
        });
    </script>
</body>
</html>
