<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高勝率 デイトレ空売りハンター</title>
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121214;
            color: #e1e1e6;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #ff5252;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #a8a8b3;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .left-panel {
            flex: 1;
            min-width: 650px;
            background: #202024;
            border-radius: 8px;
            padding: 16px;
        }
        .right-panel {
            width: 450px;
            background: #202024;
            border-radius: 8px;
            padding: 16px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #2e2e32;
        }
        th {
            background-color: #121214;
            color: #a8a8b3;
        }
        tr:hover {
            background-color: #29292e;
            cursor: pointer;
        }
        .badge-fire {
            background-color: #ff5252;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        .badge-warn {
            background-color: #ff9800;
            color: black;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        .badge-wait {
            color: #e1a100;
        }
        .gain-text {
            color: #00e676;
            font-weight: bold;
        }
        #chart {
            width: 100%;
            height: 350px;
            margin-top: 10px;
        }
        .loading {
            color: #e1a100;
            font-weight: bold;
        }
        .trade-info {
            background: #18181b;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 13px;
        }
        .trade-info span {
            display: inline-block;
            margin-right: 15px;
        }
        .stop-text { color: #ff5252; font-weight: bold; }
        .profit-text { color: #00e676; font-weight: bold; }
    </style>
</head>
<body>

    <h1>📉 当日デイトレ空売りハンター</h1>
    <div class="subtitle">本日急騰 ➔ VWAP割れ ＋ 出来高急増の「利確急落銘柄」を自動スキャン</div>

    <div class="container">
        <!-- 左側: シグナル銘柄一覧 -->
        <div class="left-panel">
            <h2>空売りチャンス銘柄一覧</h2>
            <p id="status-msg" class="loading">データを取得中...</p>
            <table>
                <thead>
                    <tr>
                        <th>コード/銘柄</th>
                        <th>現在値</th>
                        <th>当日最大上昇</th>
                        <th>VWAP</th>
                        <th>判定 / トレード指示</th>
                    </tr>
                </thead>
                <tbody id="signal-list">
                    <!-- JavaScriptで動的生成 -->
                </tbody>
            </table>
        </div>

        <!-- 右側: 5分足チャート詳細 -->
        <div class="right-panel">
            <h2 id="chart-title">銘柄を選択してください</h2>
            <div id="trade-guide" class="trade-info" style="display:none;">
                <span>損切り目安: <b id="stop-val" class="stop-text">-</b></span>
                <span>目標利確: <b id="profit-val" class="profit-text">-</b></span>
            </div>
            <div id="chart"></div>
        </div>
    </div>

    <script>
        let chart = null;
        let candleSeries = null;
        let vwapSeries = null;

        function initChart() {
            const chartContainer = document.getElementById('chart');
            chartContainer.innerHTML = '';
            
            chart = LightweightCharts.createChart(chartContainer, {
                layout: {
                    backgroundColor: '#202024',
                    textColor: '#e1e1e6',
                },
                grid: {
                    vertLines: { color: '#2e2e32' },
                    horzLines: { color: '#2e2e32' },
                },
                timeScale: {
                    timeVisible: true,
                    secondsVisible: false,
                },
            });

            candleSeries = chart.addCandlestickSeries({
                upColor: '#00e676',
                downColor: '#ff5252',
                borderVisible: false,
                wickUpColor: '#00e676',
                wickDownColor: '#ff5252',
            });

            vwapSeries = chart.addLineSeries({
                color: '#ff9800',
                lineWidth: 2,
                title: 'VWAP',
            });
        }

        async function loadChart(item) {
            document.getElementById('chart-title').innerText = `${item.code} ${item.name} (5分足)`;
            
            // 損切り・利確ガイドの表示
            const guide = document.getElementById('trade-guide');
            guide.style.display = 'block';
            document.getElementById('stop-val').innerText = `${item.stop_loss}円 (+1.2%)`;
            document.getElementById('profit-val').innerText = `${item.take_profit}円 (-2.5%)`;

            if (!chart) initChart();

            try {
                const response = await fetch(`/api/chart/${item.code}`);
                if (!response.ok) return;
                const data = await response.json();

                if (!data.candles || data.candles.length === 0) return;

                candleSeries.setData(data.candles);
                vwapSeries.setData(data.vwap || []);
                chart.timeScale().fitContent();
            } catch (err) {
                console.error('チャート読み込みエラー:', err);
            }
        }

        async function fetchSignals() {
            try {
                const response = await fetch('/api/signals');
                const data = await response.json();
                
                const tbody = document.getElementById('signal-list');
                tbody.innerHTML = '';

                document.getElementById('status-msg').innerText = `スキャン完了: 該当 ${data.length} 銘柄`;
                document.getElementById('status-msg').className = 'normal';

                data.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.onclick = () => loadChart(item);

                    const priceStr = item.price ? item.price.toLocaleString() : '-';
                    const vwapStr = item.vwap ? item.vwap.toLocaleString() : '-';
                    const judgmentStr = item.judgment || '⚪️ 通常';

                    let badgeClass = 'badge-wait';
                    if (item.priority === 3) badgeClass = 'badge-fire';
                    else if (item.priority === 2) badgeClass = 'badge-warn';

                    tr.innerHTML = `
                        <td><strong>${item.code}</strong><br><small>${item.name}</small></td>
                        <td>${priceStr}円</td>
                        <td class="gain-text">+${item.gain}%</td>
                        <td>${vwapStr}円</td>
                        <td><span class="${badgeClass}">${judgmentStr}</span></td>
                    `;
                    tbody.appendChild(tr);
                });

                if (data.length > 0) {
                    loadChart(data[0]);
                }

            } catch (err) {
                document.getElementById('status-msg').innerText = 'データ取得に失敗しました';
                console.error(err);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchSignals();
            setInterval(fetchSignals, 60000);
        });
    </script>
</body>
</html>
