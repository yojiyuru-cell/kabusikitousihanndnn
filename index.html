<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>空売りシグナル・ダッシュボード</title>
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121214;
            color: #e1e1e6;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #00e676;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .left-panel {
            flex: 1;
            min-width: 600px;
            background: #202024;
            border-radius: 8px;
            padding: 16px;
        }
        .right-panel {
            width: 450px;
            background: #202024;
            border-radius: 8px;
            padding: 16px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #2e2e32;
        }
        th {
            background-color: #121214;
            color: #a8a8b3;
        }
        tr:hover {
            background-color: #29292e;
            cursor: pointer;
        }
        .signal-badge {
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .overheated { color: #ff5252; }
        .normal { color: #00e676; }
        #chart {
            width: 100%;
            height: 350px;
            margin-top: 10px;
        }
        .loading {
            color: #e1a100;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>📉 チャート形状スキャン・空売りダッシュボード</h1>

    <div class="container">
        <!-- 左側: シグナル銘柄一覧 -->
        <div class="left-panel">
            <h2>スキャン対象銘柄</h2>
            <p id="status-msg" class="loading">データを取得中...</p>
            <table>
                <thead>
                    <tr>
                        <th>コード/銘柄</th>
                        <th>現在値</th>
                        <th>VWAP</th>
                        <th>判定パターン / シグナル</th>
                    </tr>
                </thead>
                <tbody id="signal-list">
                    <!-- JavaScriptで動的生成 -->
                </tbody>
            </table>
        </div>

        <!-- 右側: 5分足チャート詳細 -->
        <div class="right-panel">
            <h2 id="chart-title">銘柄を選択してください</h2>
            <div id="chart-info"></div>
            <div id="chart"></div>
        </div>
    </div>

    <script>
        let chart = null;
        let candleSeries = null;
        let vwapSeries = null;

        function initChart() {
            const chartContainer = document.getElementById('chart');
            chartContainer.innerHTML = '';
            
            chart = LightweightCharts.createChart(chartContainer, {
                layout: {
                    backgroundColor: '#202024',
                    textColor: '#e1e1e6',
                },
                grid: {
                    vertLines: { color: '#2e2e32' },
                    horzLines: { color: '#2e2e32' },
                },
                timeScale: {
                    timeVisible: true,
                    secondsVisible: false,
                },
            });

            candleSeries = chart.addCandlestickSeries({
                upColor: '#00e676',
                downColor: '#ff5252',
                borderVisible: false,
                wickUpColor: '#00e676',
                wickDownColor: '#ff5252',
            });

            vwapSeries = chart.addLineSeries({
                color: '#ff9800',
                lineWidth: 2,
                title: 'VWAP',
            });
        }

        async function loadChart(code, name) {
            document.getElementById('chart-title').innerText = `${code} ${name} (5分足)`;
            
            if (!chart) initChart();

            try {
                const response = await fetch(`/api/chart/${code}`);
                if (!response.ok) {
                    document.getElementById('chart').innerText = 'チャートデータの取得に失敗しました';
                    return;
                }
                const data = await response.json();

                if (!data.candles || data.candles.length === 0) {
                    document.getElementById('chart').innerText = 'チャートデータがありません';
                    return;
                }

                candleSeries.setData(data.candles);
                vwapSeries.setData(data.vwap || []);
                chart.timeScale().fitContent();
            } catch (err) {
                console.error('チャート読み込みエラー:', err);
                document.getElementById('chart').innerText = 'チャート読み込みエラー';
            }
        }

        async function fetchSignals() {
            try {
                const response = await fetch('/api/signals');
                const data = await response.json();
                
                const tbody = document.getElementById('signal-list');
                tbody.innerHTML = '';

                document.getElementById('status-msg').innerText = `更新完了: ${data.length} 銘柄のデータを取得しました`;
                document.getElementById('status-msg').className = 'normal';

                data.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.onclick = () => loadChart(item.code, item.name);

                    const priceStr = item.price ? item.price.toLocaleString() : '-';
                    const vwapStr = item.vwap ? item.vwap.toLocaleString() : '-';
                    const judgmentStr = item.daily_judgment || '⚪️ 通常';
                    const isSignal = judgmentStr.includes('🚨');

                    tr.innerHTML = `
                        <td><strong>${item.code}</strong><br><small>${item.name}</small></td>
                        <td>${priceStr}円</td>
                        <td>${vwapStr}円</td>
                        <td><span class="signal-badge ${isSignal ? 'overheated' : ''}">${judgmentStr}</span></td>
                    `;
                    tbody.appendChild(tr);
                });

                if (data.length > 0) {
                    loadChart(data[0].code, data[0].name);
                }

            } catch (err) {
                document.getElementById('status-msg').innerText = 'データ取得に失敗しました';
                document.getElementById('status-msg').className = 'overheated';
                console.error(err);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchSignals();
            setInterval(fetchSignals, 60000);
        });
    </script>
</body>
</html>
