<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>株価テクニカル分析ダッシュボード</title>
    <!-- Lightweight Charts ライブラリ読み込み -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 20px;
            background-color: #f8f9fa;
            color: #333;
        }
        h1 {
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
            color: #2c3e50;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 650px;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            background-color: #dc3545;
            margin-right: 5px;
        }
        .chart-container {
            width: 100%;
            height: 300px;
            margin-top: 15px;
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 10px;
            background: #f1f3f5;
            padding: 10px;
            border-radius: 5px;
        }
        .loading {
            font-size: 18px;
            color: #6c757d;
        }
    </style>
</head>
<body>

    <h1>過熱感・VWAP下抜け検出ダッシュボード</h1>
    <div id="status" class="loading">データを取得中...</div>
    <div id="cards-container" class="container"></div>

    <script>
        async function fetchSignals() {
            const statusEl = document.getElementById('status');
            const container = document.getElementById('cards-container');

            try {
                const response = await fetch('/api/signals');
                const data = await response.json();

                statusEl.style.display = 'none';
                container.innerHTML = '';

                if (data.length === 0) {
                    container.innerHTML = '<p>現在、条件に該当する銘柄はありません。</p>';
                    return;
                }

                for (const item of data) {
                    createCard(item);
                }
            } catch (error) {
                console.error('Error fetching signals:', error);
                statusEl.innerText = 'データの取得に失敗しました。';
            }
        }

        async function createCard(item) {
            const container = document.getElementById('cards-container');

            const card = document.createElement('div');
            card.className = 'card';

            const patternsHtml = item.shape_patterns.length > 0 
                ? item.shape_patterns.map(p => `<span class="badge">${p}</span>`).join(' ')
                : '<span style="color:#6c757d;">なし</span>';

            card.innerHTML = `
                <h2>${item.name} (${item.code})</h2>
                <div class="info-grid">
                    <div><strong>現在値:</strong> ${item.price} 円</div>
                    <div><strong>VWAP:</strong> ${item.vwap} 円</div>
                    <div><strong>25日乖離率:</strong> ${item.daily_dev}%</div>
                    <div><strong>RSI(14):</strong> ${item.daily_rsi}</div>
                    <div><strong>利確目安:</strong> ${item.take_profit} 円</div>
                    <div><strong>損切目安:</strong> ${item.stop_loss} 円</div>
                </div>
                <div><strong>検出パターン:</strong> ${patternsHtml}</div>
                <div id="chart-${item.code}" class="chart-container"></div>
            `;

            container.appendChild(card);

            // チャートデータの描画処理
            renderChart(item.code);
        }

        async function renderChart(code) {
            try {
                const response = await fetch(`/api/chart/${code}`);
                const data = await response.json();

                const chartElement = document.getElementById(`chart-${code}`);
                if (!chartElement || data.candles.length === 0) return;

                const chart = LightweightCharts.createChart(chartElement, {
                    width: chartElement.clientWidth,
                    height: 300,
                    layout: {
                        background: { color: '#ffffff' },
                        textColor: '#333',
                    },
                    grid: {
                        vertLines: { color: '#f0f0f0' },
                        horzLines: { color: '#f0f0f0' },
                    },
                    timeScale: {
                        timeVisible: true,
                        secondsVisible: false,
                    },
                });

                // ⭕【修正ポイント】Lightweight Charts v4以降の最新API構文を使用
                const candlestickSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
                    upColor: '#26a69a',
                    downColor: '#ef5350',
                    borderVisible: false,
                    wickUpColor: '#26a69a',
                    wickDownColor: '#ef5350',
                });

                const vwapSeries = chart.addSeries(LightweightCharts.LineSeries, {
                    color: '#2962FF',
                    lineWidth: 2,
                    title: 'VWAP',
                });

                candlestickSeries.setData(data.candles);
                vwapSeries.setData(data.vwap);

                chart.timeScale().fitContent();

            } catch (error) {
                console.error(`Error rendering chart for ${code}:`, error);
            }
        }

        // ページ読み込み時に実行
        window.addEventListener('DOMContentLoaded', fetchSignals);
    </script>
</body>
</html>
